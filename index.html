<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#060B18" />

  <title>Mehul Jagwani — Fintech Marketer &amp; Trader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --navy-deep: #060b18;
      --navy-base: #0b142b;
      --navy-card: rgba(14, 25, 54, 0.78);
      --navy-field: rgba(16, 31, 66, 0.68);
      --cyan: #00e5ff;
      --blue: #38bdf8;
      --indigo: #6366f1;
      --green: #10b981;
      --white: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(56, 189, 248, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(0, 229, 255, 0.14),
          transparent 42%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(99, 102, 241, 0.25),
          transparent 48%
        ),
        linear-gradient(175deg, #060b18 0%, #0b1736 50%, #060b18 100%);
      font-family:
        "Plus Jakarta Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(
          to right,
          rgba(56, 189, 248, 0.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(56, 189, 248, 0.045) 1px,
          transparent 1px
        );
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    .card {
      width: min(100%, 392px);
      overflow: hidden;
      position: relative;
      isolation: isolate;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--navy-card);
      box-shadow:
        0 24px 60px -15px rgba(2, 6, 23, 0.85),
        0 0 42px -14px rgba(0, 229, 255, 0.22) inset;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: card-in 800ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(255, 255, 255, 0.035),
          transparent 75%
        );
      opacity: 0.8;
    }

    .band {
      height: 4px;
      background: linear-gradient(
        90deg,
        #00e5ff 0%,
        #38bdf8 35%,
        #6366f1 70%,
        #10b981 100%
      );
      box-shadow: 0 2px 16px rgba(0, 229, 255, 0.7);
    }

    .inner {
      padding: 38px 28px 28px;
      text-align: center;
    }

    .mark-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 20px;
      background: linear-gradient(145deg, #10214d 0%, #081129 100%);
      box-shadow:
        0 12px 28px -6px rgba(0, 229, 255, 0.25),
        0 0 16px -2px rgba(99, 102, 241, 0.3) inset;
      animation: icon-in 650ms 100ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .mark-icon svg {
      width: 36px;
      height: 36px;
      overflow: visible;
      stroke: var(--cyan);
      filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.45));
    }

    .name {
      color: #fff;
      font-size: 27px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.1);
      animation: text-in 600ms 180ms ease both;
    }

    .ticker-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 14px;
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 999px;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.1);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      animation: text-in 600ms 260ms ease both;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: dot-pulse 1.8s ease-in-out infinite;
    }

    .tagline {
      margin-top: 10px;
      color: #93c5fd;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.45;
      animation: text-in 600ms 320ms ease both;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px auto;
      animation: text-in 600ms 380ms ease both;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(56, 189, 248, 0.3),
        transparent
      );
    }

    .divider-node {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 11px;
      text-align: left;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 13px 16px;
      color: var(--white);
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.12);
      border-radius: 16px;
      background: var(--navy-field);
      box-shadow: 0 4px 14px rgba(2, 6, 23, 0.35);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .field:nth-child(1) {
      animation: field-in 600ms 440ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .field:nth-child(2) {
      animation: field-in 600ms 510ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .field:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 229, 255, 0.45);
      background: rgba(16, 35, 78, 0.9);
      box-shadow:
        0 8px 20px rgba(2, 6, 23, 0.4),
        0 0 14px rgba(0, 229, 255, 0.08);
    }

    .field:active {
      transform: scale(0.985);
    }

    .field:focus-visible,
    .cta:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .icon {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        rgba(0, 229, 255, 0.15),
        rgba(99, 102, 241, 0.25)
      );
    }

    .icon svg {
      width: 18px;
      height: 18px;
      stroke: var(--cyan);
    }

    .field-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .field-label {
      color: var(--blue);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .field-value {
      overflow: hidden;
      color: #f1f5f9;
      font-size: 14.5px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      padding: 15px 18px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(
        135deg,
        #00c6ff 0%,
        #0072ff 60%,
        #4f46e5 100%
      );
      box-shadow:
        0 12px 28px -8px rgba(0, 114, 255, 0.6),
        0 1px 0 rgba(255, 255, 255, 0.3) inset;
      cursor: pointer;
      font: 700 14.5px "Plus Jakarta Sans", sans-serif;
      letter-spacing: 0.01em;
      animation: field-in 600ms 580ms cubic-bezier(0.16, 1, 0.3, 1) both;
      transition:
        transform 180ms ease,
        filter 180ms ease,
        box-shadow 180ms ease;
    }

    .cta:hover {
      filter: brightness(1.08);
      box-shadow:
        0 14px 32px -6px rgba(0, 198, 255, 0.65),
        0 0 18px rgba(0, 229, 255, 0.16);
    }

    .cta:active {
      transform: scale(0.98);
    }

    .cta svg {
      width: 18px;
      height: 18px;
      flex: none;
      stroke: #fff;
    }

    .footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid rgba(56, 189, 248, 0.12);
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      animation: text-in 600ms 650ms ease both;
    }

    .keyword {
      display: inline;
      padding: 0 4px;
      border-radius: 5px;
      color: #fff;
      background: linear-gradient(
        90deg,
        rgba(0, 229, 255, 0.18),
        rgba(99, 102, 241, 0.28)
      );
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.12);
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes icon-in {
      from {
        opacity: 0;
        transform: scale(0.75) rotate(-8deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes text-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes field-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dot-pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.55;
        transform: scale(0.78);
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 20px 12px;
      }

      .inner {
        padding: 32px 20px 22px;
      }

      .name {
        font-size: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="band" aria-hidden="true"></div>

    <div class="inner">
      <!-- Fintech trading logo -->
      <div class="mark-icon" aria-hidden="true">
        
      </div>

      <h1 class="name">Mehul Jagwani</h1>

      <div class="ticker-chip">
        <span class="status-dot"></span>
        <span>Fintech &bull; Markets</span>
      </div>

      <p class="tagline">
        <span class="keyword">Fintech Marketer</span>
        &amp; Part-time Trader
      </p>

      <div class="divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-node"></span>
        <span class="divider-line"></span>
      </div>

      <div class="fields">
        <a class="field" href="tel:+918866465048">
          <span class="icon" aria-hidden="true">
            
          </span>

          <span class="field-text">
            <span class="field-label">Phone</span>
            <span class="field-value">+91 88664 65048</span>
          </span>
        </a>

        <a class="field" href="mailto:mehul.digitalm@gmail.com">
          <span class="icon" aria-hidden="true">
            
          </span>

          <span class="field-text">
            <span class="field-label">Email</span>
            <span class="field-value">mehul.digitalm@gmail.com</span>
          </span>
        </a>
      </div>

      <button
        type="button"
        class="cta"
        id="saveContactBtn"
        aria-label="Save Mehul Jagwani as a contact"
      >
        

        <span>Save Contact</span>
      </button>

      <p class="footer">
        <span class="keyword">FINTECH</span>
        &bull;
        <span class="keyword">QUANT</span>
        &bull;
        <span class="keyword">GROWTH MARKETING</span>
      </p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var saveButton = document.getElementById("saveContactBtn");

      if (!saveButton) {
        return;
      }

      saveButton.addEventListener("click", function () {
        var vcard = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:Jagwani;Mehul;;;",
          "FN:Mehul Jagwani",
          "TITLE:Fintech Marketer & Part-time Trader",
          "TEL;TYPE=CELL:+918866465048",
          "EMAIL;TYPE=INTERNET:mehul.digitalm@gmail.com",
          "END:VCARD"
        ].join("
") + "
";

        var isIOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (
            navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1
          );

        if (isIOS) {
          var iosVCardUrl =
            "data:text/vcard;charset=utf-8," +
            encodeURIComponent(vcard);

          window.location.href = iosVCardUrl;
          return;
        }

        var blob = new Blob(
          [vcard],
          { type: "text/vcard;charset=utf-8" }
        );

        var objectUrl = URL.createObjectURL(blob);
        var downloadLink = document.createElement("a");

        downloadLink.href = objectUrl;
        downloadLink.download = "Mehul_Jagwani.vcf";
        downloadLink.style.display = "none";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        window.setTimeout(function () {
          URL.revokeObjectURL(objectUrl);
        }, 1000);
      });
    })();
  </script>
</body>
</html>
