<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mehul Jagwani — Fintech Marketer &amp; Trader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --navy-deep:#060B18;
    --navy-base:#0B142B;
    --navy-surface:#101F42;
    --navy-card:rgba(14,25,54,.78);
    --border-glass:rgba(56,189,248,.18);
    --cyan-accent:#00E5FF;
    --blue-neon:#38BDF8;
    --indigo-glow:#6366F1;
    --emerald-up:#10B981;
    --text-primary:#F8FAFC;
    --text-muted:#94A3B8;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,
  body{
    height:100%;
  }

  body{
    min-height:100dvh;
    background-color:var(--navy-deep);
    background-image:
      radial-gradient(at 0% 0%,rgba(0,229,255,.14) 0,transparent 50%),
      radial-gradient(at 100% 100%,rgba(99,102,241,.22) 0,transparent 55%),
      linear-gradient(175deg,#060B18 0%,#0B1736 50%,#060B18 100%);
    color:var(--text-primary);
    font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(to right,rgba(56,189,248,.04) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(56,189,248,.04) 1px,transparent 1px);
    background-size:32px 32px;
    pointer-events:none;
  }

  @media (prefers-reduced-motion:no-preference){
    .card{
      animation:floatIn .8s cubic-bezier(.16,1,.3,1) both;
    }

    .mark-icon{
      animation:pulseGlow .6s ease both .1s;
    }

    .field,
    .cta{
      animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both;
    }

    .field:nth-of-type(1){
      animation-delay:.28s;
    }

    .field:nth-of-type(2){
      animation-delay:.38s;
    }

    .cta{
      animation-delay:.48s;
    }
  }

  @keyframes floatIn{
    from{
      opacity:0;
      transform:translateY(22px) scale(.98);
    }

    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  @keyframes fadeUp{
    from{
      opacity:0;
      transform:translateY(12px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  @keyframes pulseGlow{
    from{
      transform:scale(.85);
      opacity:0;
    }

    to{
      transform:scale(1);
      opacity:1;
    }
  }

  .card{
    width:100%;
    max-width:392px;
    background:var(--navy-card);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:28px;
    overflow:hidden;
    box-shadow:
      0 24px 60px -15px rgba(2,6,23,.85),
      0 0 0 1px var(--border-glass),
      0 0 45px -12px rgba(0,229,255,.12) inset;
    position:relative;
  }

  .band{
    height:4px;
    background:linear-gradient(
      90deg,
      #00E5FF 0%,
      #38BDF8 35%,
      #6366F1 70%,
      #10B981 100%
    );
    box-shadow:0 2px 14px rgba(0,229,255,.6);
  }

  .inner{
    padding:38px 28px 28px;
    text-align:center;
  }

  .mark-icon{
    width:68px;
    height:68px;
    margin:0 auto 20px;
    border-radius:20px;
    background:linear-gradient(145deg,#10214D 0%,#081129 100%);
    border:1px solid rgba(0,229,255,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
      0 12px 28px -6px rgba(0,229,255,.25),
      0 0 16px -2px rgba(99,102,241,.3) inset;
  }

  .mark-icon svg{
    width:34px;
    height:34px;
    stroke:var(--cyan-accent);
  }

  .name{
    font-size:27px;
    font-weight:800;
    line-height:1.15;
    letter-spacing:-.02em;
    color:#FFFFFF;
    text-shadow:0 2px 12px rgba(255,255,255,.1);
  }

  .ticker-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(16,185,129,.1);
    border:1px solid rgba(16,185,129,.28);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:#6EE7B7;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--emerald-up);
    box-shadow:0 0 8px var(--emerald-up);
  }

  .tagline{
    margin-top:10px;
    font-size:13.5px;
    font-weight:600;
    line-height:1.45;
    color:#93C5FD;
    letter-spacing:-.01em;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:22px auto;
  }

  .divider-line{
    flex:1;
    height:1px;
    background:linear-gradient(
      90deg,
      transparent,
      rgba(56,189,248,.25),
      transparent
    );
  }

  .divider-node{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--cyan-accent);
    box-shadow:0 0 8px var(--cyan-accent);
  }

  .fields{
    display:flex;
    flex-direction:column;
    gap:11px;
    text-align:left;
  }

  .field{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 16px;
    background:rgba(16,31,66,.65);
    border-radius:16px;
    text-decoration:none;
    color:var(--text-primary);
    border:1px solid rgba(56,189,248,.12);
    box-shadow:0 4px 14px rgba(2,6,23,.35);
    transition:
      transform .18s ease,
      border-color .18s ease,
      background .18s ease;
  }

  .field:hover{
    background:rgba(16,35,78,.9);
    border-color:rgba(0,229,255,.45);
    transform:translateY(-1px);
  }

  .field:active{
    transform:scale(.985);
  }

  .field:focus-visible{
    outline:2px solid var(--cyan-accent);
    outline-offset:2px;
  }

  .icon{
    flex:none;
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(
      135deg,
      rgba(0,229,255,.15) 0%,
      rgba(99,102,241,.25) 100%
    );
    border:1px solid rgba(0,229,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon svg{
    width:18px;
    height:18px;
    stroke:var(--cyan-accent);
  }

  .field-text{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }

  .field-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--blue-neon);
  }

  .field-value{
    font-size:14.5px;
    font-weight:600;
    color:#F1F5F9;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .cta{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    cursor:pointer;
    margin-top:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 18px;
    border-radius:16px;
    background:linear-gradient(
      135deg,
      #00C6FF 0%,
      #0072FF 60%,
      #4F46E5 100%
    );
    color:#FFFFFF;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.01em;
    text-decoration:none;
    box-shadow:
      0 12px 28px -8px rgba(0,114,255,.6),
      0 1px 0 rgba(255,255,255,.3) inset;
    transition:
      transform .18s ease,
      box-shadow .18s ease,
      filter .18s ease;
  }

  .cta:hover{
    filter:brightness(1.08);
    box-shadow:0 14px 32px -6px rgba(0,198,255,.65);
  }

  .cta:active{
    transform:scale(.98);
  }

  .cta:focus-visible{
    outline:2px solid var(--cyan-accent);
    outline-offset:2px;
  }

  .cta svg{
    width:18px;
    height:18px;
    stroke:#FFFFFF;
    flex:none;
  }

  .footer{
    margin-top:24px;
    padding-top:14px;
    border-top:1px solid rgba(56,189,248,.12);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:500;
  }
</style>
</head>

<body>
  <main class="card">
    <div class="band" aria-hidden="true"></div>

    <div class="inner">
      <div class="mark-icon" aria-hidden="true">
        
      </div>

      <h1 class="name">Mehul Jagwani</h1>

      <div class="ticker-chip">
        <span class="status-dot"></span>
        <span>Fintech &bull; Markets</span>
      </div>

      <p class="tagline">Fintech Marketer &amp; Part-time Trader</p>

      <div class="divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-node"></span>
        <span class="divider-line"></span>
      </div>

      <div class="fields">
        <a class="field" href="tel:+918866465048">
          <span class="icon" aria-hidden="true">
            
          </span>

          <span class="field-text">
            <span class="field-label">Phone</span>
            <span class="field-value">+91 88664 65048</span>
          </span>
        </a>

        <a class="field" href="mailto:mehul.digitalm@gmail.com">
          <span class="icon" aria-hidden="true">
            
          </span>

          <span class="field-text">
            <span class="field-label">Email</span>
            <span class="field-value">mehul.digitalm@gmail.com</span>
          </span>
        </a>
      </div>

      <button
        type="button"
        class="cta"
        id="saveContactBtn"
      >
        

        <span>Save Contact</span>
      </button>

      <p class="footer">FINTECH &bull; QUANT &bull; GROWTH MARKETING</p>
    </div>
  </main>

<script>
  document
    .getElementById('saveContactBtn')
    .addEventListener('click', function () {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Jagwani;Mehul;;;',
        'FN:Mehul Jagwani',
        'TITLE:Fintech Marketer & Part-time Trader',
        'TEL;TYPE=CELL:+918866465048',
        'EMAIL;TYPE=INTERNET:mehul.digitalm@gmail.com',
        'END:VCARD'
      ].join('
') + '
';

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === 'MacIntel' &&
          navigator.maxTouchPoints > 1
        );

      if (isIOS) {
        const vcardUrl =
          'data:text/vcard;charset=utf-8,' +
          encodeURIComponent(vcard);

        window.location.href = vcardUrl;
        return;
      }

      const blob = new Blob(
        [vcard],
        { type: 'text/vcard;charset=utf-8' }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = 'Mehul_Jagwani.vcf';
      link.style.display = 'none';

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    });
</script>
</body>
</html>
