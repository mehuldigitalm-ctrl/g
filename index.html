<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mehul Jagwani — Akshaya Harvest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #1F6237;
    --forest-mid: #164A2A;
    --forest-deep: #0D2B18;
    --gold: #D9A23B;
    --gold-bright: #F1BE55;
    --gold-deep: #96681F;
    --cream: #FAF5E7;
    --cream-deep: #F0E5C9;
    --ink: #12271A;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }

  body{
    min-height: 100dvh;
    background:
      radial-gradient(620px circle at 18% -6%, rgba(241,190,85,0.20), transparent 55%),
      radial-gradient(700px circle at 100% 110%, rgba(31,98,55,0.55), transparent 60%),
      linear-gradient(160deg, var(--forest-deep) 0%, var(--forest-mid) 52%, var(--forest-deep) 100%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* faint grain texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(250,245,231,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both; }
    .flourish path{ animation: draw 1.5s ease forwards 0.3s; }
    .mark{ animation: fadeUp 0.6s ease both 0.08s; }
    .field, .cta{ animation: fadeUp 0.5s ease both; }
    .field:nth-of-type(1){ animation-delay: 0.5s; }
    .field:nth-of-type(2){ animation-delay: 0.62s; }
    .cta{ animation-delay: 0.76s; }
  }
  @keyframes rise{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes draw{ from{ stroke-dashoffset:340; } to{ stroke-dashoffset:0; } }

  .card{
    width:100%;
    max-width: 388px;
    background: var(--cream);
    border-radius: 30px;
    overflow:hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 30px 60px -18px rgba(0,0,0,0.55),
      0 0 0 1px rgba(13,43,24,0.06);
    position:relative;
  }

  .band{
    height: 9px;
    background: linear-gradient(90deg, var(--gold-deep) 0%, var(--gold-bright) 30%, var(--forest) 65%, var(--forest-deep) 100%);
  }

  .inner{ padding: 42px 30px 32px; text-align:center; }

  .mark{
    width: 150px;
    height:auto;
    margin: 0 auto 18px;
    display:block;
    filter: drop-shadow(0 6px 14px rgba(13,43,24,0.16));
  }

  .name{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size: 31px;
    line-height:1.1;
    letter-spacing:-0.01em;
    color: var(--forest-deep);
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top: 12px;
    padding: 6px 14px 6px 12px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.13em;
    text-transform:uppercase;
    color: var(--forest-deep);
    box-shadow: 0 6px 14px -4px rgba(150,104,31,0.55);
  }

  .company{
    margin-top: 10px;
    font-family:'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--forest);
  }

  .flourish{ display:block; width:172px; height:34px; margin: 24px auto 24px; }
  .flourish path{
    fill:none; stroke: var(--gold-deep); stroke-width:2.4;
    stroke-linecap:round; stroke-dasharray:340; stroke-dashoffset:0;
  }

  .fields{ display:flex; flex-direction:column; gap:11px; text-align:left; }

  .field{
    display:flex; align-items:center; gap:14px;
    padding: 13px 15px;
    background: var(--cream-deep);
    border-radius: 16px;
    text-decoration:none; color:var(--ink);
    border: 1px solid rgba(13,43,24,0.07);
    transition: transform .15s ease, background .15s ease;
  }
  .field:active{ transform: scale(0.985); background: #e9dcb8; }
  .field:focus-visible{ outline: 2px solid var(--forest); outline-offset: 2px; }

  .icon{
    flex:none; width:38px; height:38px; border-radius:11px;
    background: linear-gradient(155deg, var(--forest) 0%, var(--forest-deep) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:18px; height:18px; stroke: var(--cream); }

  .field-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .field-label{ font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color: var(--gold-deep); }
  .field-value{ font-size:14.5px; font-weight:700; color: var(--forest-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .cta{
    appearance: none;
    -webkit-appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    margin-top: 18px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%;
    padding: 15px 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-deep) 100%);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    font-weight: 800;
    font-size: 14.5px;
    letter-spacing: 0.02em;
    text-decoration:none;
    box-shadow: 0 14px 26px -10px rgba(13,43,24,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta:active{ transform: scale(0.98); }
  .cta:focus-visible{ outline: 2px solid var(--gold-bright); outline-offset:2px; }
  .cta svg{ width:18px; height:18px; stroke: var(--gold-bright); flex:none; }

  .footer{
    margin-top: 26px; padding-top:16px;
    border-top: 1px solid rgba(13,43,24,0.1);
    font-size: 10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color: rgba(18,39,26,0.42); font-weight:700;
  }
</style>
</head>
